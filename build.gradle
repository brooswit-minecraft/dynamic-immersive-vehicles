plugins {
 id 'java-library'
 id 'net.neoforged.moddev' version '2.0.148'
}

group = 'io.github.brooswitminecraft'
version = '0.1.0-SNAPSHOT'
base { archivesName = 'dynamic-immersive-vehicles' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
 mavenCentral()
 exclusiveContent {
  forRepository {
   maven {
    name = 'RyanHCode Maven'
    url = 'https://maven.ryanhcode.dev/releases'
   }
  }
  filter {
   includeGroup 'dev.ryanhcode.sable'
   includeGroup 'dev.ryanhcode.sable-companion'
  }
 }
 exclusiveContent {
  forRepository {
   maven {
    name = 'Curse Maven'
    url = 'https://cursemaven.com'
   }
  }
  filter { includeGroup 'curse.maven' }
 }
}

neoForge {
 version = '21.1.265'
 runs {
  client { client() }
  // 'nogui': headless CI has no display/AWT; the vanilla dedicated-server GUI would throw.
  server {
   server()
   programArgument('nogui')
   // Opt-in anchor-frame probe (ticket comment 53243/53244) - OFF for every normal
   // `gradle runServer` (including the existing runtime-smoke CI job); only a dedicated
   // CI job that sets DIV_ANCHOR_FRAME_PROBE=true before invoking this task turns it on.
   // Never affects a developer's own local runServer use.
   if (System.getenv('DIV_ANCHOR_FRAME_PROBE') == 'true') {
    jvmArgument('-Ddiv.experimentalAnchorFrameProbe=true')
   }
   // Opt-in two-body impulse-response probe (review comment 53280) - same gating pattern as
   // the anchor-frame probe above; OFF for every normal `gradle runServer`.
   if (System.getenv('DIV_TWO_BODY_IMPULSE_PROBE') == 'true') {
    jvmArgument('-Ddiv.experimentalTwoBodyImpulseProbe=true')
   }
   // Opt-in real-vehicle ground-support fixture (review comment 53287) - also turns on the
   // two-body chassis candidate itself (EXPERIMENTAL_TWO_BODY_CHASSIS), since the whole point of
   // this fixture is exercising stepGround with it actually enabled, not merely present. Also
   // enables the existing GroundContactDiagnostics (-Ddiv.debugGroundContact) and its per-wheel
   // trace window (-Ddiv.debugGroundContactTicks) for review 53291's "require/record actual
   // PhysicsBridge activation + twoBodyActive + resolved f/mass" and "positive wheel support" -
   // both are this project's own pre-existing diagnostics, not new plumbing added for this
   // fixture; the CI job's own shell script greps their log lines as an activation gate
   // independent of this probe's own COMPLETE marker, so a native-physics fallback (which could
   // still move the vehicle somewhat plausibly) cannot be mistaken for DIV actually engaging.
   if (System.getenv('DIV_GROUND_SUPPORT_FIXTURE') == 'true') {
    jvmArgument('-Ddiv.experimentalGroundSupportFixture=true')
    jvmArgument('-Ddiv.experimentalTwoBodyChassis=true')
    jvmArgument('-Ddiv.debugGroundContact=true')
    jvmArgument('-Ddiv.debugGroundContactTicks=400')
   }
   // Review 53305's "preserve comparable OFF/f=.5/f=.4 evidence": the SAME fixture, SAME
   // activation/debug diagnostics, but WITHOUT the two-body candidate - a real, reusable
   // single-body comparison baseline, not a throwaway local edit. Lets the exact same DRIVE-
   // phase instability (or its absence) be checked against the shipped default path on demand.
   if (System.getenv('DIV_GROUND_SUPPORT_FIXTURE_OFF') == 'true') {
    jvmArgument('-Ddiv.experimentalGroundSupportFixture=true')
    // Ticket 53310/53312: PhysicsBridge.EXPERIMENTAL_TWO_BODY_CHASSIS now defaults to true on
    // this branch - this OFF baseline must keep explicitly disabling it (previously relied on
    // the old default-false), or it would silently stop being a real single-body comparison.
    jvmArgument('-Ddiv.experimentalTwoBodyChassis=false')
    jvmArgument('-Ddiv.debugGroundContact=true')
    jvmArgument('-Ddiv.debugGroundContactTicks=400')
   }
   // Review 53327's brake-only speed sweep - same two-body/OFF split pattern as the ground-
   // support fixture above (EXPERIMENTAL_TWO_BODY_CHASSIS is a per-JVM static flag, not
   // per-vehicle, so OFF/.5/.4 cannot share one server run). debugGroundContactTicks is large
   // enough to cover every scenario's own SETTLE+ACCELERATE+HOLD+BRAKE window (up to ~460
   // ticks each) without truncating the per-wheel normal-force/impulse trace this sweep relies
   // on for load-transfer evidence.
   if (System.getenv('DIV_BRAKE_SWEEP_PROBE') == 'true') {
    jvmArgument('-Ddiv.experimentalBrakeSweepProbe=true')
    jvmArgument('-Ddiv.experimentalTwoBodyChassis=true')
    jvmArgument('-Ddiv.debugGroundContact=true')
    jvmArgument('-Ddiv.debugGroundContactTicks=500')
   }
   if (System.getenv('DIV_BRAKE_SWEEP_PROBE_OFF') == 'true') {
    jvmArgument('-Ddiv.experimentalBrakeSweepProbe=true')
    jvmArgument('-Ddiv.experimentalTwoBodyChassis=false')
    jvmArgument('-Ddiv.debugGroundContact=true')
    jvmArgument('-Ddiv.debugGroundContactTicks=500')
   }
   // Review 53331/53332/53339/53340's occupied baseline-vs-tuned turn comparison - both
   // scenarios use the two-body chassis (baseline f=.5, tuned f=.1), so a single gate (no
   // OFF variant needed, unlike the ground-support/brake-sweep probes above).
   if (System.getenv('DIV_TURN_COMPARISON_PROBE') == 'true') {
    jvmArgument('-Ddiv.experimentalTurnComparisonProbe=true')
    jvmArgument('-Ddiv.experimentalTwoBodyChassis=true')
    jvmArgument('-Ddiv.debugGroundContact=true')
    jvmArgument('-Ddiv.debugGroundContactTicks=600')
    // Review 53341: match the REAL verified installed baseline's own runtime flags (53333 -
    // "Effective-mass damping=true, friction solver64 iterations, ramp20"), not this probe's
    // own local defaults, so the comparison is apples-to-apples with what's actually installed.
    jvmArgument('-Ddiv.experimentalEffectiveMassDamping=true')
    jvmArgument('-Ddiv.experimentalFrictionSolverIterations=64')
    jvmArgument('-Ddiv.experimentalThrottleRampTicks=20')
   }
   // MINECRAFT-508 review (John): opt-in mod-load/tag-resolution smoke test - same gating
   // pattern as every other probe above; OFF for every normal `gradle runServer`.
   if (System.getenv('DIV_GROUND_SURFACE_TAG_PROBE') == 'true') {
    jvmArgument('-Ddiv.experimentalGroundSurfaceTagProbe=true')
   }
   // Ticket MINECRAFT-504 review (John, comment 53617): opt-in wheel-aux state-machine probe -
   // same gating pattern as every other probe above; OFF for every normal `gradle runServer`.
   if (System.getenv('DIV_WHEEL_AUX_PROBE') == 'true') {
    jvmArgument('-Ddiv.experimentalWheelAuxProbe=true')
   }
   // MINECRAFT-518 review (comment 53675/53676/53679/53689/53701): opt-in float-only-hull
   // angular-water-drag runtime probe - same gating pattern as every other probe above; OFF for
   // every normal `gradle runServer`. Also enables the existing GroundContactDiagnostics (review
   // 53701's "verify actual BuoyantBody activation") so each scenario's own classify/constructed
   // log lines independently confirm floating=true / class=BuoyantBody, not a native fallback.
   if (System.getenv('DIV_BUOYANCY_ANGULAR_DRAG_PROBE') == 'true') {
    jvmArgument('-Ddiv.experimentalBuoyancyAngularDrag=true')
    jvmArgument('-Ddiv.debugGroundContact=true')
   }
   // MINECRAFT-517 independent review (PR #16): opt-in real-oak_log canonical-texture/rotation
   // smoke test - same gating pattern as every other probe above; OFF for every normal
   // `gradle runServer`.
   if (System.getenv('DIV_DIRECTIONAL_GROUND_SURFACE_PROBE') == 'true') {
    jvmArgument('-Ddiv.experimentalDirectionalGroundSurfaceProbe=true')
   }
   // MINECRAFT-526: opt-in fixed-wing/rotorcraft activation/default/configured/live-reload
   // runtime fixture - same gating pattern as every other probe above; OFF for every normal
   // `gradle runServer`.
   if (System.getenv('DIV_FLIGHT_ROTOR_RUNTIME_FIXTURE_PROBE') == 'true') {
    jvmArgument('-Ddiv.experimentalFlightRotorRuntimeFixtureProbe=true')
    // MINECRAFT-527 (merged to main, PR #25) fixed the real production defect this ticket's own
    // live runs discovered: PhysicsBridge.Body.useTwoBody now excludes any non-GROUND stepper
    // automatically, regardless of the global flag's own value - so this probe no longer needs
    // to force the flag off. Left at its real default (unset/true) so this probe now validates
    // the actual production default, not an isolated workaround.
    jvmArgument('-Ddiv.debugGroundContact=true')
   }
   // MINECRAFT-525 review (comment 53817/53832): opt-in hitch rotation-frame composition
   // probe - same gating pattern as every other probe above; OFF for every normal
   // `gradle runServer`.
   if (System.getenv('DIV_HITCH_ROTATION_FRAME_PROBE') == 'true') {
    jvmArgument('-Ddiv.experimentalHitchRotationFrameProbe=true')
   }
  }
 }
 mods { dynamicimmersivevehicles { sourceSet sourceSets.main } }
}

dependencies {
 // Resolve dependencies from their publishers; never commit or bundle their jars.
 // 'implementation' (not 'compileOnly') so the headless runtime-smoke server run can load
 // these classes too; the plain 'jar' task below still only zips this project's own
 // classes/resources, so none of these dependency jars are bundled into the output artifact.
 implementation('curse.maven:minecraft-transport-simulator-286703:7926606') { transitive = false }
 implementation('dev.ryanhcode.sable:sable-neoforge-1.21.1:2.0.5') { transitive = false }
 implementation('dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0') { transitive = false }
 // The neoForge moddev plugin only wires JOML into the 'main' sourceSet it knows about as a
 // mod (see the 'mods' block above); plain unit tests (PhysicsBridgeClassificationTest, which
 // loads the real PhysicsBridge class) need it explicitly, pinned to the same version NeoForge
 // itself resolves, so a hitch joint's JOML constraint-configuration types are resolvable
 // without a live Minecraft/NeoForge runtime.
 testImplementation 'org.joml:joml:1.10.5'
 testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test { useJUnitPlatform() }

jar {
 from('LICENSE', 'THIRD_PARTY_NOTICES.md')
}
