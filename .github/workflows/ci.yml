name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.8'

      - name: Compile and test
        run: gradle --no-daemon --stacktrace clean build

      - name: Record artifact checksums
        run: sha256sum build/libs/*.jar > build/artifact-checksums.txt

      - name: Upload addon artifact and test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dynamic-immersive-vehicles-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/libs/*.jar
            build/artifact-checksums.txt
            build/reports/tests/test/**
            build/test-results/test/**
