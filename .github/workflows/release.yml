name: Release build

# On-demand release packaging (MINECRAFT-550), separated from the ordinary PR/main
# regression path in ci.yml: this builds the distributable addon jar and its
# checksum from a chosen ref and attaches them to the workflow run as a
# downloadable artifact. It does NOT create or publish a GitHub Release itself -
# every existing release on this repo (see `gh release list`) was created by hand
# with hand-written release notes, and that review/notes step is not something
# this workflow invents a substitute for. The existing manual step is: download
# this run's artifact, then `gh release create <tag> <jar> <checksum> --notes ...`
# as before. This just removes the need to build that jar from a live, uploaded
# PR build; it builds clean from the exact ref being released.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA to build the release artifact from'
        required: true
        default: 'main'

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out ${{ inputs.ref }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve the checked-out commit and a safe artifact label
        # Review finding: upload-artifact rejects '/' in artifact names, but inputs.ref
        # accepts ordinary branch names containing '/' (e.g. the branch this very fix was
        # reviewed on, minecraft-550/simplify-ci-regression-release) - sanitize before use.
        # Also: `github.sha` names the workflow-dispatch event's own ref (normally main),
        # NOT inputs.ref's checked-out commit, so resolve and record the real one instead.
        id: resolved
        env:
          REF: ${{ inputs.ref }}
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          safe_ref="$(printf '%s' "$REF" | tr -c 'A-Za-z0-9._-' '-')"
          echo "safe_ref=$safe_ref" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.8'

      - name: Compile, test, and package
        run: gradle --no-daemon --stacktrace clean build

      - name: Record the resolved commit and artifact checksum
        # Checksum paths are written relative to `build/`, matching the layout the
        # downloaded-and-extracted artifact will actually have (upload-artifact uses the
        # least common ancestor of the uploaded paths as the archive root), so
        # `sha256sum -c artifact-checksums.txt` works directly against the extracted files.
        run: |
          echo "${{ steps.resolved.outputs.sha }}" > build/RELEASE_COMMIT.txt
          cd build
          sha256sum libs/*.jar > artifact-checksums.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: dynamic-immersive-vehicles-release-${{ steps.resolved.outputs.safe_ref }}-${{ steps.resolved.outputs.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            build/libs/*.jar
            build/artifact-checksums.txt
            build/RELEASE_COMMIT.txt
